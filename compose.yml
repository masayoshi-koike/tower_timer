services:
  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/tower_timer_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pomodoro_app_development
    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec vite dev
    volumes:
      - .:/app
    ports:
      - "3036:3036"
    environment:
      VITE_RUBY_HOST: 0.0.0.0
    depends_on:
      - web
volumes:
  postgres_data: