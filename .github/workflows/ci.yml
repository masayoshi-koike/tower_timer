name: RSpec CI

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Setup Database
        run: docker compose run --rm web bin/rails db:create db:schema:load

      - name: Run RSpec
        run: docker compose run --rm web bundle exec rspec